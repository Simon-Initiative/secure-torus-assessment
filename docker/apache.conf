ServerName moodle.test
Listen ${MOODLE_HTTPS_PORT}

<VirtualHost *:80>
    ServerName moodle.test
    Redirect permanent / ${MOODLE_WWWROOT}/
</VirtualHost>

<VirtualHost *:${MOODLE_HTTPS_PORT}>
    ServerName moodle.test
    SSLEngine on
    SSLCertificateFile /etc/moodle/tls/moodle.crt
    SSLCertificateKeyFile /etc/moodle/tls/moodle.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        AcceptPathInfo On
        RewriteEngine On
        # Preserve existing PHP scripts with slash arguments (files, images, CSS).
        RewriteCond %{DOCUMENT_ROOT}/$1 -f
        RewriteRule ^(.+\.php)(/.*)?$ - [END]
        # Missing PHP paths must reach Moodle too; mod_php bypasses FallbackResource.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ r.php [END]
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
